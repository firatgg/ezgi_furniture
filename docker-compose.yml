version: '3.4'

services:
  ezgi_mobilya.db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=ezgi_mobilya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  ezgi_mobilya.web:
    image: ezgimobilyaweb
    build:
      context: .
      dockerfile: src/ezgi_mobilya.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=ezgi_mobilya.db;Database=ezgi_mobilya_db;Username=postgres;Password=mysecretpassword;
    ports:
      - "5000:8080"
    depends_on:
      - ezgi_mobilya.db

volumes:
  postgres-data:
