version: '3.4'

services:
  ezgi_mobilya.db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-ezgi_mobilya_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  ezgi_mobilya.web:
    image: ezgimobilyaweb
    build:
      context: .
      dockerfile: src/ezgi_mobilya.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=ezgi_mobilya.db;Database=${POSTGRES_DB:-ezgi_mobilya_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      - SiteContact__InstagramUrl=${SITE_CONTACT_INSTAGRAM_URL:-}
      - SiteContact__InstagramLabel=${SITE_CONTACT_INSTAGRAM_LABEL:-}
      - SiteContact__WhatsAppUrl=${SITE_CONTACT_WHATSAPP_URL:-}
      - SiteContact__WhatsAppLabel=${SITE_CONTACT_WHATSAPP_LABEL:-}
      - SiteContact__Email=${SITE_CONTACT_EMAIL:-contact@ezgicraft.com}
      - SiteContact__PhoneUrl=${SITE_CONTACT_PHONE_URL:-}
      - SiteContact__PhoneLabel=${SITE_CONTACT_PHONE_LABEL:-}
      - SiteContact__AddressLabel=${SITE_CONTACT_ADDRESS_LABEL:-}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__From=${SMTP_FROM:-}
      - Smtp__FromName=${SMTP_FROM_NAME:-Ezgi Craft}
      - SocialMedia__Instagram__AccessToken=${SOCIALMEDIA_INSTAGRAM_ACCESSTOKEN:-}
      - SocialMedia__Instagram__BusinessAccountId=${SOCIALMEDIA_INSTAGRAM_BUSINESSACCOUNTID:-}
      - SocialMedia__Facebook__PageId=${SOCIALMEDIA_FACEBOOK_PAGEID:-}
      - SocialMedia__Facebook__AccessToken=${SOCIALMEDIA_FACEBOOK_ACCESSTOKEN:-}
    ports:
      - "5080:8080"
    depends_on:
      - ezgi_mobilya.db

volumes:
  postgres-data:
